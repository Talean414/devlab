name: CI

# Validates the renderer and the native Rust backend on every push and pull request.
# The native job is the authoritative gate for src-tauri changes: `cargo check`, the
# library unit tests and clippy run against a real Linux Tauri toolchain. Nothing here
# deploys, publishes or touches secrets; only read-only checks and build artifacts.

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: devlab

jobs:
  renderer:
    name: Renderer typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devlab/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Upload renderer build for the native job
        uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: devlab/dist
          retention-days: 1
          if-no-files-found: error

  native:
    name: Native check + tests + clippy (Linux)
    needs: renderer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev patchelf
      # tauri::generate_context! requires frontendDist (../dist) to exist at compile time.
      - name: Restore renderer build
        uses: actions/download-artifact@v4
        with:
          name: renderer-dist
          path: devlab/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: devlab/src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo test (lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Formatting is reported but not yet enforced; it becomes blocking once the tree is confirmed clean.
      - name: cargo fmt (report only)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Upload Cargo.lock produced by this run
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: devlab/src-tauri/Cargo.lock
          retention-days: 7
          if-no-files-found: warn
