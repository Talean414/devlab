[package]
name = "devlab"
version = "1.2.0"
description = "Native, AI-assisted developer control plane"
authors = ["Talean414"]
license = "MIT"
repository = "https://github.com/Talean414/devlab"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
log = "0.4"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.3" }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
