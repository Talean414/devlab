[package]
name = "devlab"
version = "1.35.0"
description = "Native, AI-assisted developer control plane"
authors = ["Talean414"]
license = "MIT"
repository = "https://github.com/Talean414/devlab"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
base64 = "0.22"
fallible-iterator = "0.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
libc = "0.2"
log = "0.4"
native-tls = "0.2.12"
notify = "8"
portable-pty = "0.9"
postgres = "0.19.10"
postgres-native-tls = "0.5.0"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks", "limits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.3" }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
wait-timeout = "0.2"
zeroize = "1.8"
